name: Supabase DB migrations

on:
  push:
    branches:
      - develop
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/supabase-db-push.yml'
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Push database migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          PROJECT_REF="${SUPABASE_PROJECT_REF:-fbyyfyhdglcpkhxskffj}"
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is not set in GitHub repo secrets."
            echo "Create a token at https://supabase.com/dashboard/account/tokens"
            echo "Then add secret SUPABASE_ACCESS_TOKEN (optional SUPABASE_PROJECT_REF=$PROJECT_REF)."
            echo "If link fails, also add SUPABASE_DB_PASSWORD (Database password from Project Settings → Database)."
            exit 1
          fi

          # Apply idempotent push analytics migrations directly via Supabase Management API
          # so legacy migration history mismatches do not block schema updates
          for sql_file in \
            supabase/migrations/20260925121000_web_push_config.sql \
            supabase/migrations/20260925123000_web_push_subscription_rpc.sql \
            supabase/migrations/20260925140000_push_notifications_dashboard.sql \
            supabase/migrations/20260925170000_push_dispatches_trigger_type.sql; do
            if [ -f "$sql_file" ]; then
              echo "Applying $sql_file via Supabase Management API..."
              HTTP_CODE=$(jq -Rs '{query: .}' "$sql_file" | curl -sS -o /tmp/sql_resp.json -w "%{http_code}" -X POST \
                "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
                -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
                -H "Content-Type: application/json" \
                -d @-)
              if [ "$HTTP_CODE" -ge 400 ]; then
                echo "Error ($HTTP_CODE) applying $sql_file:"
                cat /tmp/sql_resp.json
                exit 1
              fi
            fi
          done

          if [ -n "${SUPABASE_DB_PASSWORD:-}" ]; then
            supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD" || true
          else
            supabase link --project-ref "$PROJECT_REF" || true
          fi
          supabase db push --include-all --yes || true


