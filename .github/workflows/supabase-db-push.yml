name: Supabase DB migrations

on:
  push:
    branches:
      - develop
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/supabase-db-push.yml'
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Push database migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          PROJECT_REF="${SUPABASE_PROJECT_REF:-fbyyfyhdglcpkhxskffj}"
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is not set in GitHub repo secrets."
            echo "Create a token at https://supabase.com/dashboard/account/tokens"
            echo "Then add secret SUPABASE_ACCESS_TOKEN (optional SUPABASE_PROJECT_REF=$PROJECT_REF)."
            echo "If link fails, also add SUPABASE_DB_PASSWORD (Database password from Project Settings → Database)."
            exit 1
          fi

          if [ -n "${SUPABASE_DB_PASSWORD:-}" ]; then
            supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
          else
            supabase link --project-ref "$PROJECT_REF"
          fi
          supabase db push --yes
