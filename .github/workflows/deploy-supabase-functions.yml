name: Deploy Supabase Edge Functions

on:
  push:
    branches:
      - develop
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - '.github/workflows/deploy-supabase-functions.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy generate-daily-blog
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          PROJECT_REF="${SUPABASE_PROJECT_REF:-fbyyfyhdglcpkhxskffj}"
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "Skipping deploy: add SUPABASE_ACCESS_TOKEN to GitHub repo secrets."
            echo "Create one at https://supabase.com/dashboard/account/tokens"
            echo "Project ref (already known): $PROJECT_REF"
            exit 0
          fi
          supabase functions deploy generate-daily-blog --project-ref "$PROJECT_REF" --no-verify-jwt
